<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Calculator</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --calc-bg: #141414;
            --btn-gray: #1e1e1e;
            --btn-hover: #2a2a2a;
            --accent: #ffffff;
            --text-main: #e0e0e0;
            --operator-text: #888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        .calculator {
            width: 98vw;
            height: 96vh;
            max-width: 1400px;
            background-color: var(--calc-bg);
            border: 1px solid #222;
            padding: 40px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }

        .header {
            color: #444;
            font-size: 0.8rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .link a {
            color: #444;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            margin-bottom: 10px;

        }


        #display {
            width: 100%;
            height: 25%;
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 200;
            text-align: right;
            padding: 20px 0;
            outline: none;
            border-bottom: 1px solid #222;
            margin-bottom: 30px;
        }

        .buttons {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        button {
            border: 1px solid #222;
            background: var(--btn-gray);
            color: var(--text-main);
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 300;
            cursor: pointer;
            transition: all 0.15s ease;
            border-radius: 4px;
        }

        button:hover {
            background: var(--btn-hover);
            border-color: #444;
        }

        button:active {
            background: #000;
            transform: scale(0.98);
        }

        .operator {
            color: var(--operator-text);
            font-weight: 400;
        }

        .equal {
            background: var(--accent);
            color: var(--bg-color);
            border: none;
            font-weight: 600;
        }

        .equal:hover {
            background: #cccccc;
        }

        .clear {
            color: #ff453a;
        }

        /* Responsive UI for Mobile */
        @media (max-width: 600px) {
            .calculator {
                padding: 20px;
                height: 100vh;
                width: 100vw;
                border: none;
            }
            .buttons { gap: 10px; }
            #display { height: 30%; }
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="header">made by ted brown</div>
    <div class="link"><a href="https://tedjb.co.uk/">@tedjb.co.uk</a></div>
    <div class="link"><a href="https://github.com/codeporttb/">@github.com/codeporttb</a></div>
    <input type="text" id="display" readonly placeholder="0">
    
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="operator" onclick="backspace()">⌫</button>
        <button class="operator" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">÷</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">×</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">−</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>
        
        <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendValue(val) {
        if (display.value === 'Error') clearDisplay();
        display.value += val;
    }

    function clearDisplay() {
        display.value = '';
    }

    function backspace() {
        display.value = display.value.slice(0, -1);
    }

    function calculate() {
        try {
            // Evaluates mathematical string safely
            let result = eval(display.value.replace('×', '*').replace('÷', '/'));
            if (result === undefined) return;
            
            // Format result to avoid long decimals
            display.value = Number.isInteger(result) ? result : parseFloat(result.toFixed(8));
        } catch (e) {
            display.value = "Error";
            setTimeout(clearDisplay, 1000);
        }
    }

    // Allow keyboard support
    document.addEventListener('keydown', (e) => {
        if (e.key >= 0 && e.key <= 9) appendValue(e.key);
        if (e.key === '.') appendValue('.');
        if (e.key === 'Enter' || e.key === '=') calculate();
        if (e.key === 'Backspace') backspace();
        if (e.key === 'Escape') clearDisplay();
        if (['+', '-', '*', '/'].includes(e.key)) appendValue(e.key);
    });
</script>

</body>
</html>
